<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Náufrago — RPG de supervivencia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b1a2e;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
button{font-family:inherit;cursor:pointer;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;outline:none}
canvas#c{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;display:block}
.hidden{display:none!important}
body.nog #top,body.nog #ctrl,body.nog #joyHint,body.nog #chip{display:none}
#top{position:fixed;top:calc(6px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#hud{align-self:stretch;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lcol{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;max-width:300px}
.bar{display:flex;align-items:center;gap:5px;font-size:12px;width:min(44vw,200px);max-width:100%}
.track{position:relative;flex:1;height:10px;background:rgba(0,0,0,.45);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.fill{height:100%;width:100%;transition:width .2s}
.hp{background:linear-gradient(#ff6b6b,#d63a3a)}.hun{background:linear-gradient(#f5b25a,#d9822b)}.thi{background:linear-gradient(#6cc8ff,#2f8fd6)}.en{background:linear-gradient(#ffe36b,#d9b12b)}.xpf{background:linear-gradient(#b48cff,#7a4fe0)}
.low{animation:blink .5s infinite alternate}@keyframes blink{to{opacity:.3}}
#effs{font-size:15px;letter-spacing:2px;text-shadow:0 1px 2px #000;min-height:2px}
#obj{font-size:12px;background:rgba(0,0,0,.45);padding:5px 8px;border-radius:9px;line-height:1.3;border-left:3px solid #f5c542}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;font-weight:600;text-shadow:0 1px 2px #000;white-space:nowrap;flex:none;max-width:50vw}
#islL{max-width:50vw;overflow:hidden;text-overflow:ellipsis}
.right>div:not(.xpw):not(:empty){background:rgba(0,0,0,.38);padding:1px 7px;border-radius:9px}.xpw{width:84px;display:flex}.xpw .track{height:6px}
#mm{width:84px;height:84px;border-radius:8px;border:2px solid rgba(255,255,255,.3);image-rendering:pixelated;background:#1d4e89;pointer-events:auto}
#bossBar{width:min(82vw,340px);text-align:center;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000}
#bossBar .track{height:12px;margin-top:3px;border-color:rgba(255,120,120,.6)}
#bossB{background:linear-gradient(#ff5a5a,#a11);height:100%;width:100%}
#msg{background:rgba(0,0,0,.78);padding:7px 13px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;max-width:min(92vw,520px);text-align:center;line-height:1.35}
#msg.show{opacity:1}
#chip{position:fixed;left:calc(10px + env(safe-area-inset-left));bottom:calc(150px + env(safe-area-inset-bottom));background:rgba(245,197,66,.95);color:#1c2a3a;font-weight:700;font-size:13px;border-radius:18px;padding:6px 6px 6px 12px;display:flex;align-items:center;gap:8px}
#chip button{background:#1c2a3a;color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:13px}
#ctrl{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.rowb{display:flex;gap:10px;align-items:center}
#bA{width:82px;height:82px;border-radius:50%;font-size:32px;background:rgba(245,197,66,.88);border:3px solid rgba(255,255,255,.6);box-shadow:0 4px 12px rgba(0,0,0,.4)}
#bA.dim{opacity:.45}#bA:active{transform:scale(.94)}
.sb{position:relative;width:50px;height:50px;border-radius:50%;font-size:22px;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.35)}
.sb:active{transform:scale(.92)}.sb.cd{opacity:.4}
.sb i{position:absolute;right:-4px;bottom:-4px;font-style:normal;font-size:11px;font-weight:700;background:#1c2a3a;border-radius:8px;padding:0 4px;border:1px solid rgba(255,255,255,.3)}
#actL{font-size:12px;font-weight:600;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:8px;min-height:20px;text-shadow:0 1px 2px #000;max-width:190px;text-align:center}
#actL:empty{visibility:hidden}
#joyBase{position:fixed;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:none;pointer-events:none}
#joyKnob{position:absolute;left:28px;top:28px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55)}
#joyHint{position:fixed;left:18px;bottom:calc(26px + env(safe-area-inset-bottom));font-size:12px;color:rgba(255,255,255,.55);pointer-events:none;text-shadow:0 1px 2px #000}
#panel{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.pcard{width:min(540px,100%);height:min(84vh,760px);background:#1c2a3a;border-radius:16px 16px 0 0;display:flex;flex-direction:column;border-top:3px solid #f5c542}
.phead{display:flex;align-items:center;gap:4px;padding:8px 8px 6px;border-bottom:1px solid rgba(255,255,255,.1)}
#tabs{flex:1;display:flex;gap:4px;overflow-x:auto;touch-action:pan-x}
#tabs button{position:relative;flex:1;min-width:34px;height:40px;font-size:19px;padding:0;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid transparent}
#tabs button.on{background:rgba(245,197,66,.22);border-color:#f5c542}
#tabs button b{position:absolute;top:2px;right:4px;width:9px;height:9px;border-radius:50%;background:#ff5a5a}
#pclose{background:none;border:none;font-size:20px;padding:6px 10px}
#pbody{flex:1;overflow-y:auto;padding:8px 12px calc(16px + env(safe-area-inset-bottom));touch-action:pan-y;-webkit-overflow-scrolling:touch}
h4{font-size:13px;color:#f5c542;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.5px}
h4:first-child{margin-top:2px}
.row{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
.ic{font-size:24px;width:32px;text-align:center;flex:none}
.nm{flex:1;font-size:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.nm small{color:#9fb3c8;font-size:12px;line-height:1.3}
.req{font-size:12px;display:flex;flex-wrap:wrap;gap:6px;margin-top:1px}.ok{color:#7ee08a}.no{color:#ff8a80}
.bt{background:#f5c542;color:#1c2a3a;border:none;border-radius:8px;padding:8px 10px;font-weight:700;font-size:13px;white-space:nowrap;flex:none}
.bt.s2{background:rgba(255,255,255,.14);color:#fff}.bt.red{background:#c0473d;color:#fff}
.bt:disabled{background:#33455a;color:#7d8fa3}
.tag{font-size:11px;color:#7ee08a;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{background:rgba(255,255,255,.08);border-radius:14px;padding:5px 9px;font-size:13px;border:1px solid transparent}
button.chip.on{border-color:#f5c542;background:rgba(245,197,66,.2)}
.muted{color:#9fb3c8;font-size:13px;line-height:1.45;padding:4px 2px}
.pbar{height:8px;background:rgba(0,0,0,.4);border-radius:5px;overflow:hidden;margin-top:3px}.pbar div{height:100%;background:#7ee08a}
#mapC{width:100%;height:46vh;border-radius:10px;touch-action:none;display:block;background:#0f2f57}
.lore{background:rgba(255,255,255,.06);border-left:3px solid #c9a26b;padding:8px 10px;margin:6px 0;border-radius:6px;font-size:13px;line-height:1.45;font-style:italic;color:#e8dcc0}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}
input[type=range]{flex:1;max-width:190px;accent-color:#f5c542;touch-action:pan-x}
textarea{width:100%;height:70px;background:#0f1a27;color:#cfe;border:1px solid #33455a;border-radius:8px;padding:6px;font-size:11px;font-family:monospace;user-select:text;-webkit-user-select:text;touch-action:auto}
input[type=text]{width:100%;background:#0f1a27;color:#fff;border:1px solid #33455a;border-radius:8px;padding:10px;font-size:15px;user-select:text;-webkit-user-select:text}
#modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{width:min(460px,100%);max-height:84vh;background:#1c2a3a;border-radius:14px;border:2px solid #f5c542;display:flex;flex-direction:column}
#mdT{font-size:17px;padding:12px 14px 6px;color:#f5c542}
#mdB{padding:4px 14px;overflow-y:auto;touch-action:pan-y;font-size:14px;line-height:1.5}
#mdB p{margin:6px 0}
#mdF{padding:10px 14px 12px;display:flex;gap:8px;flex-wrap:wrap}
#mdF .big{flex:1;margin:0}
#menu{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(20,70,110,.9),rgba(5,12,25,.97));padding:20px;overflow:auto;touch-action:pan-y}
.mcard{max-width:420px;width:100%;text-align:center;margin:auto}
#mt{font-size:42px;letter-spacing:4px;color:#f5c542;text-shadow:0 3px 0 #8a5a12}
#ms{color:#bcd;margin:6px 0 18px;line-height:1.45;font-size:14px}
.big{display:block;width:100%;padding:13px;margin:9px 0;border:none;border-radius:12px;background:#f5c542;color:#1c2a3a;font-size:17px;font-weight:800}
.big.sec{background:rgba(255,255,255,.15);color:#fff}.big.sm{font-size:14px;padding:11px}
.big:disabled{background:#33455a;color:#7d8fa3}
.help{margin-top:14px;font-size:13px;color:#bcd;line-height:1.6;text-align:left;background:rgba(0,0,0,.3);padding:12px;border-radius:10px}
.opts{display:flex;gap:8px;margin:8px 0}.opts button{flex:1;padding:10px 4px;border-radius:10px;border:2px solid transparent;background:rgba(255,255,255,.12);font-size:13px;font-weight:700}
.opts button.on{border-color:#f5c542;background:rgba(245,197,66,.2)}
#fade{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none;transition:opacity .7s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
<div id="hud">
  <div class="lcol">
    <div class="bar"><span>❤️</span><div class="track"><div id="hpB" class="fill hp"></div></div></div>
    <div class="bar"><span>🍖</span><div class="track"><div id="hunB" class="fill hun"></div></div></div>
    <div class="bar"><span>💧</span><div class="track"><div id="thiB" class="fill thi"></div></div></div>
    <div class="bar"><span>⚡</span><div class="track"><div id="enB" class="fill en"></div></div></div>
    <div id="effs"></div>
    <div id="obj"></div>
  </div>
  <div class="right">
    <div id="dayL"></div>
    <div id="lvlL"></div>
    <div class="xpw"><div class="track"><div id="xpB" class="fill xpf"></div></div></div>
    <canvas id="mm" width="80" height="80"></canvas>
    <div id="islL"></div>
  </div>
</div>
<div id="bossBar" class="hidden"><span id="bossN"></span><div class="track"><div id="bossB"></div></div></div>
<div id="msg"></div>
</div>
<div id="chip" class="hidden"><span id="chipT"></span><button id="chipX">✕</button></div>
<div id="joyHint">◀ Arrastra aquí para moverte</div>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="ctrl">
  <div id="actL"></div>
  <div class="rowb"><button id="bQ" class="sb" aria-label="Acceso rápido">🍽️</button><button id="bB" class="sb hidden" aria-label="Disparar">🏹</button></div>
  <div class="rowb"><button id="bD" class="sb" aria-label="Esquivar">💨</button><button id="bA" aria-label="Interactuar">✋</button></div>
  <div class="rowb"><button id="bI" class="sb" aria-label="Mochila">🎒</button><button id="bC" class="sb" aria-label="Fabricar">🔨</button></div>
</div>
<div id="panel" class="hidden"><div class="pcard"><div class="phead"><div id="tabs"></div><button id="pclose" aria-label="Cerrar">✕</button></div><div id="pbody"></div></div></div>
<div id="modal" class="hidden"><div class="mbox"><h3 id="mdT"></h3><div id="mdB"></div><div id="mdF"></div></div></div>
<div id="fade"></div>
<div id="menu"><div class="mcard"><h1 id="mt">NÁUFRAGO</h1><p id="ms"></p><div id="menuBody"></div></div></div>
<script>
'use strict';
/* ===== NÚCLEO ===== */
const TS=32,CS=16,CELL=96,DAY=300,SAVE_KEY='naufrago2_save',CFG_KEY='naufrago2_cfg';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick=a=>a[(Math.random()*a.length)|0];
const hyp=Math.hypot;
let aHeld=false,menuType='';
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash3(s,x,y){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,1274126177);h=Math.imul(h^(h>>>13),1274126177);h=Math.imul(h^(h>>>16),0x85ebca6b);return(h^(h>>>15))>>>0}
function strSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h|0}
function noise2(rng){const p=new Float32Array(16384);for(let i=0;i<16384;i++)p[i]=rng();
 const g=(x,y)=>p[((y&127)<<7)|(x&127)];
 return(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1),top=a+(b-a)*u,bot=c+(d-c)*u;return top+(bot-top)*v}}
function fbm(n,x,y){let s=0,a=.5,f=1;for(let k=0;k<4;k++){s+=a*n(x*f,y*f);a*=.5;f*=2}return s/.9375}
function hexRGB(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function shade(h,a){const c=hexRGB(h),f=a<0?0:255,t=Math.abs(a);return`rgb(${Math.round(c[0]+(f-c[0])*t)},${Math.round(c[1]+(f-c[1])*t)},${Math.round(c[2]+(f-c[2])*t)})`}
const esc=s=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function dirName(dx,dy){const a=Math.atan2(dy,dx);return['este','sureste','sur','suroeste','oeste','noroeste','norte','noreste'][((Math.round(a/(Math.PI/4))%8)+8)%8]}

/* ===== DATOS ===== */
const K={DEEP:0,SHAL:1,SAND:2,GRASS:3,FOREST:4,ROCK:5,FRESH:6,SPEC:7};
const B={TROP:0,JUNG:1,SWAMP:2,ARID:3,VOLC:4,GLAC:5,CURS:6};
const BIO=[
 {n:'Trópico',ic:'🌴',rock:1,fo:.53,po:.69},
 {n:'Selva',ic:'🌿',rock:.98,fo:.43,po:.67},
 {n:'Manglar',ic:'🐊',rock:1.05,fo:.5,po:.6},
 {n:'Desierto',ic:'🏜️',rock:.9,fo:.7,po:.8},
 {n:'Volcán',ic:'🌋',rock:.84,fo:.62,po:.76},
 {n:'Glaciar',ic:'❄️',rock:.92,fo:.5,po:.69},
 {n:'Isla maldita',ic:'☠️',rock:.9,fo:.5,po:.72}];
const BIOP=['una isla tropical','una isla de selva','una isla de manglar','una isla desértica','una isla volcánica','una isla glaciar','una isla maldita'];
const IDOLN=['del Trópico','de la Selva','del Manglar','del Desierto','del Volcán','del Glaciar','Maldito'];
// colores por bioma y tipo de casilla: mar hondo, bajío, arena, suelo, espesura, roca, agua dulce, especial
const PAL=[
 ['#1d4e89','#3b8fd0','#e8d49c','#74b356','#4a8a3e','#8f8c82','#56b8e0','#74b356'],
 ['#1d4e89','#3a9fc0','#dccf9a','#4f9a44','#2f6f33','#7d8273','#4fb0c8','#4f9a44'],
 ['#1d4e89','#4d8f9a','#b9ae82','#7a9650','#587a3c','#77786a','#3f7f7a','#6b5a3e'],
 ['#1d4e89','#45a0d6','#f0d9a0','#d9b877','#c2a060','#b08a62','#58bfe6','#d9b877'],
 ['#1d4e89','#3a7fb5','#4a4744','#5c5650','#45403c','#3a3634','#7fd0c0','#e8591a'],
 ['#1d4e89','#6fb7e0','#cfd8dc','#eef3f6','#d5e2e8','#9aa7b0','#a8dcf0','#eef3f6'],
 ['#1d4e89','#3d6f8a','#9a947f','#5a6650','#3f4a3d','#5d5a66','#3a3050','#5a6650']];
const RGB=PAL.map(r=>r.map(hexRGB));
const SPK=PAL.map(r=>r.map(h=>[shade(h,-.1),shade(h,.11)]));
const O={NONE:0,TREE:1,PALM:2,BOULDER:3,BUSH:4,BUSHE:5,DRIFT:6,PEBBLE:7,STUMP:8,PALME:9,RUBBLE:10,IRON:11,OBS:12,CRYS:13,GOLD:14,CACTUS:15,CACTE:16,MUSH:17,HERB:18,REED:19,BANANA:20,BANE:21,BONES:22,BOTTLE:23,SHELL:24,CORN:25,YUCA:26,CHEST:27,CHESTO:28,RWALL:29,ALTAR:30,BRAZ:31,WRECK:32,WRECKE:33,TENT:34,TRADER:35,
 FIRE:50,SHELTER:51,COLLECT:52,SIGNAL:53,BENCH:54,FURN:55,PCHEST:56,PLOT:57,WALL:58,DOOR:59,TORCH:60,TRAP:61,BED:62,ANVIL:63,TOTEM:64};
const SOLID=new Set([O.TREE,O.PALM,O.PALME,O.BOULDER,O.IRON,O.OBS,O.CRYS,O.GOLD,O.CACTUS,O.CACTE,O.BANANA,O.BANE,O.CHEST,O.CHESTO,O.RWALL,O.ALTAR,O.BRAZ,O.WRECK,O.WRECKE,O.TENT,O.TRADER,O.FIRE,O.SHELTER,O.COLLECT,O.SIGNAL,O.BENCH,O.FURN,O.PCHEST,O.WALL,O.BED,O.ANVIL,O.TOTEM]);
const FLAT=new Set([O.DRIFT,O.PEBBLE,O.STUMP,O.RUBBLE,O.MUSH,O.HERB,O.BONES,O.BOTTLE,O.SHELL,O.PLOT,O.TRAP]);
const NOACT=new Set([O.RUBBLE,O.CHESTO,O.WRECKE,O.RWALL,O.BRAZ,O.TENT,O.WALL,O.DOOR,O.TORCH,O.TRAP]);
const ROCKS=new Set([O.BOULDER,O.IRON,O.OBS,O.CRYS,O.GOLD]);
const LIGHT={};LIGHT[O.FIRE]=175;LIGHT[O.TORCH]=125;LIGHT[O.BRAZ]=120;LIGHT[O.FURN]=90;LIGHT[O.ALTAR]=70;LIGHT[O.TOTEM]=70;
const PICKUP={};PICKUP[O.DRIFT]=.5;PICKUP[O.PEBBLE]=.5;PICKUP[O.SHELL]=.5;PICKUP[O.MUSH]=.5;PICKUP[O.HERB]=.4;PICKUP[O.REED]=.6;PICKUP[O.BONES]=.2;PICKUP[O.BOTTLE]=.12;PICKUP[O.CORN]=.4;PICKUP[O.YUCA]=.4;
const PITEM={};PITEM[O.FIRE]='fogata';PITEM[O.SHELTER]='refugio';PITEM[O.COLLECT]='recolector';PITEM[O.SIGNAL]='senal';PITEM[O.BENCH]='mesa';PITEM[O.FURN]='horno';PITEM[O.PCHEST]='cofre';PITEM[O.PLOT]='parcela';PITEM[O.WALL]='muro';PITEM[O.DOOR]='puerta';PITEM[O.TORCH]='antorcha';PITEM[O.TRAP]='trampa';PITEM[O.BED]='cama';PITEM[O.ANVIL]='yunque';PITEM[O.TOTEM]='totem';

const chunks=new Map(),islCache=new Map(),ringCache=new Map(),thumbs=new Map(),objHp=new Map();
function initWorld(seed){WSEED=seed|0;const r=mulberry(WSEED^0x2f6e);n1=noise2(r);n2=noise2(r);n3=noise2(r);
 for(const c of chunks.values())if(c.cv)c.cv.width=0;
 chunks.clear();islCache.clear();ringCache.clear();thumbs.clear();objHp.clear();lastC=null;cvCount=0}
// posición de una celda dentro de su anillo (0..8r-1)
function ringPos(cx,cy){const r=Math.max(Math.abs(cx),Math.abs(cy));if(!r)return 0;if(cy===-r)return cx+r;if(cx===r)return 2*r+cy+r;if(cy===r)return 4*r+r-cx;return 6*r+r-cy}
// biomas garantizados por anillo, para que la historia siempre sea completable
function forcedRing(r){let f=ringCache.get(r);if(f)return f;f={};if(r<1){ringCache.set(r,f);return f}const n=8*r;
 const put=(k,b)=>{let i=hash3(WSEED,r*31+k,991)%n;while(f[i]!==undefined)i=(i+1)%n;f[i]=b};
 if(r===1){put(0,B.JUNG);put(1,B.TROP)}
 else if(r===2){put(0,B.SWAMP);put(1,B.ARID);put(2,B.JUNG)}
 else if(r===3){put(0,B.VOLC);put(1,B.GLAC);put(2,B.SWAMP);put(3,B.ARID)}
 else if(r===4){put(0,B.CURS);put(1,B.VOLC);put(2,B.GLAC)}
 else{put(0,B.CURS);put(1,r%6);put(2,(r*3+1)%7)}
 ringCache.set(r,f);return f}
const BW=[null,[3,3,1,1,0,0,0],[1,3,3,3,1,0,0],[1,2,2,2,3,3,0],[1,1,2,2,3,3,3]];
function pickBio(t,r){const w=BW[Math.min(t,4)];let s=0;for(const x of w)s+=x;let q=r()*s;for(let i=0;i<7;i++){q-=w[i];if(q<0)return i}return 0}
function island(cx,cy){const key=cx+','+cy;let is=islCache.get(key);if(is)return is;
 const r=mulberry(hash3(WSEED,cx,cy)),tier=Math.max(Math.abs(cx),Math.abs(cy));
 if(!cx&&!cy)is={cx,cy,key,x:0,y:0,R:40,bio:0,tier:0,main:1,forced:0,name:'Isla del Naufragio'};
 else{const f=forcedRing(tier)[ringPos(cx,cy)],fo=f!==undefined,ex=fo||r()<.8,R=ex?(fo?36+r()*8:28+r()*16):9+r()*5;
  const x=Math.round(cx*CELL+(r()-.5)*26),y=Math.round(cy*CELL+(r()-.5)*26),bio=ex?(fo?f:pickBio(tier,r)):0;
  is={cx,cy,key,x,y,R,bio,tier,main:ex?1:0,forced:fo?1:0};
  is.name=ex?NP[(r()*NP.length)|0]+' '+(r()<.5?NA[(r()*NA.length)|0]:NB[bio][(r()*3)|0]):'Islote'}
 is.pois=makePois(is,r);is.altar=is.pois.some(p=>p.t==='altar');is.trader=is.pois.some(p=>p.t==='trader');
 islCache.set(key,is);return is}
function makePois(is,r){const P=[],a0=r()*6.283;
 const at=(da,fr,t,ex)=>P.push(Object.assign({t,x:Math.round(is.x+Math.cos(a0+da)*is.R*fr),y:Math.round(is.y+Math.sin(a0+da)*is.R*fr)},ex));
 if(!is.main){if(r()<.45)P.push({t:'ichest',x:is.x,y:is.y});return P}
 if(is.bio!==B.VOLC&&is.bio!==B.CURS)at(0,.15,'spring');
 at(1.3,.3,'mine');
 if(is.tier===0)return P;
 const q=[r(),r(),r(),r(),r(),r()];
 if(is.forced||q[0]<.5)at(2.6,.38,'altar');
 if(is.bio!==B.CURS&&q[1]<.4)at(3.9,.35,'trader');
 if(q[2]<.7)at(5.2,.42,'ruin');
 if(q[3]<.3)at(.65,.45,'ruin');
 if(q[4]<.5)at(3.2,.64,'wreck',{c:q[5]<.5});
 return P}
function hAt(is,tx,ty){const dx=(tx-is.x)/is.R,dy=(ty-is.y)/is.R,d2=dx*dx+dy*dy;if(d2>1.05)return -1;return fbm(n1,tx/11,ty/11)*.8+.55-d2*1.1-Math.sqrt(d2)*.25}
function kindFor(is,h,tx,ty){if(h<.25)return K.SHAL;if(h<.33)return K.SAND;if(!is.main)return h>.62?K.GRASS:K.SAND;const b=BIO[is.bio];
 if(h>.42&&fbm(n3,tx/5,ty/5)>b.po)return K.FRESH;
 if(is.bio===B.VOLC&&h>.5&&fbm(n3,tx/7+40,ty/7+40)>.68)return K.SPEC;
 if(is.bio===B.SWAMP&&fbm(n2,tx/6+70,ty/6+70)>.6)return K.SPEC;
 if(h>b.rock)return K.ROCK;
 if(h>.4&&fbm(n2,tx/9,ty/9)>b.fo)return K.FOREST;
 return K.GRASS}
// estructuras del mundo: devuelve [tipo de casilla, objeto] o null
function stamp(p,dx,dy,is){const ax=Math.abs(dx),ay=Math.abs(dy);
 switch(p.t){
 case'spring':if(ax<=1&&ay<=1)return[K.FRESH,0];if(ax<=2&&ay<=2)return[K.GRASS,0];break;
 case'mine':if(ax<=2&&ay<=2){let o=0;const mo=[O.IRON,O.IRON,O.IRON,O.GOLD,O.OBS,O.CRYS,O.GOLD][is.bio];
   if(ax===1&&ay===1)o=dx===dy?mo:O.IRON;else if((!dx&&!dy)||(ax===2&&ay===2))o=O.BOULDER;return[K.ROCK,o]}break;
 case'altar':if(ax<=3&&ay<=3){let o=0;if(!dx&&!dy)o=O.ALTAR;else if(ax===2&&ay===2)o=O.BRAZ;return[ax<=2&&ay<=2?K.ROCK:K.GRASS,o]}break;
 case'trader':if(ax<=2&&ay<=2){let o=0;if(dx===-1&&!dy)o=O.TENT;else if(dx===1&&!dy)o=O.TRADER;else if(!dx&&dy===1)o=O.FIRE;return[K.GRASS,o]}break;
 case'ruin':if(ax<=3&&ay<=3){if(ax>2||ay>2)return[K.GRASS,0];let o=0;if(!dx&&!dy)o=O.CHEST;else if((ax===2||ay===2)&&!(dx===0&&dy===2)&&hash3(WSEED,p.x+dx,p.y+dy)%100>15)o=O.RWALL;return[K.ROCK,o]}break;
 case'wreck':if(ax<=2&&ay<=1){let o=0;if(!dy&&ax<=1)o=O.WRECK;else if(p.c&&!dx&&dy===1)o=O.CHEST;return[K.SAND,o]}break;

 let best=null,bd=1e9,fish=null,fd=1e9;const tx=Math.floor(P.x/TS),ty=Math.floor(P.y/TS);
 if(!G.demol){
  for(const e of G.ents){const d=hyp(e.x-P.x,e.y-P.y)-EN[e.type].r;if(d<S.rng-6&&d<bd){bd=d;best={kind:'ent',e,label:(EN[e.type].flee?'Cazar ':'Atacar ')+EN[e.type].n.toLowerCase()}}}
  if(best)return best;
  if(G.maps.length){const m=G.maps[0];if(Math.abs(m.x-tx)<=1&&Math.abs(m.y-ty)<=1)return{kind:'dig',label:G.tools.pico?'Excavar tesoro ❌':'Tesoro (falta ⛏️)'}}}
 for(let y=ty-1;y<=ty+1;y++)for(let x=tx-1;x<=tx+1;x++){const o=objAt(x,y),cx=x*TS+16,cy=y*TS+16,raw=hyp(cx-P.x,cy-P.y);if(raw>52)continue;
  const dot=raw?((cx-P.x)*P.fx+(cy-P.y)*P.fy)/raw:1,sc=raw-dot*12;
  if(G.demol){if(o>=50&&natAt(x,y)!==o&&sc<bd){bd=sc;best={kind:'demol',tx:x,ty:y,label:'Desmontar '+IT[PITEM[o]].n.toLowerCase()}}continue}
  if(o&&!NOACT.has(o)){const lb=objLabel(o,x,y);if(lb){if(sc<bd){bd=sc;best={kind:'obj',tx:x,ty:y,label:lb}}continue}}
  if(o&&SOLID.has(o))continue;
  const t=tileAt(x,y),k=t&7;
  if(k===K.FRESH){if(sc<bd){bd=sc;best={kind:'fresh',tx:x,ty:y,label:FRL[t>>3]}}}
  else if(k<=K.SHAL&&G.tools.cana&&sc<fd){fd=sc;fish={kind:'fish',tx:x,ty:y,k,label:'Pescar 🎣'}}}

 else if(type==='import'){$('mt').textContent='IMPORTAR';$('ms').textContent='Pega el código que exportaste desde ⚙️ Ajustes en otro dispositivo.';
  b.innerHTML='<textarea id="mCode" placeholder="Código de la partida"></textarea><button id="mGo" class="big">Cargar</button><button id="mBack" class="big sec sm">Volver</button>';
  $('mGo').onclick=()=>{AU.init();if(!importCode($('mCode').value))$('ms').textContent='⚠️ Ese código no es válido. Cópialo completo e inténtalo de nuevo.';else save(true)};$('mBack').onclick=()=>showMenu('title')}
 else if(type==='help'){$('mt').textContent='CÓMO JUGAR';$('ms').textContent='';b.innerHTML=`<div class="help">${HELP}</div><button id="mBack" class="big sec sm">Volver</button>`;$('mBack').onclick=()=>showMenu('title')}
 else if(type==='dead'){$('mt').textContent='HAS MUERTO';$('ms').innerHTML=`${arg}.<br>${st()}`;b.innerHTML='<button id="mNew" class="big">Nueva partida</button><button id="mBack" class="big sec sm">Menú principal</button>';$('mNew').onclick=()=>showMenu('new');$('mBack').onclick=()=>{G=null;showMenu('title')}}
 else{$('mt').textContent='¡RESCATADO!';$('ms').innerHTML=`Al amanecer, un barco fondea frente a tu playa. Esta vez nada lo detiene: la Bestia ha muerto y el Collar está roto.<br><br>Subes a bordo y miras atrás. El archipiélago sigue ahí, infinito, lleno de islas sin nombre...<br><br><b>FIN</b><br>${st()}`;
  b.innerHTML='<button id="mCont" class="big">Seguir explorando (modo infinito)</button><button id="mBack" class="big sec sm">Menú principal</button>';
  $('mCont').onclick=()=>{menuType='';running=true;G.paused=false;m.classList.add('hidden');toast('El capitán promete volver cada luna. Las islas lejanas te esperan.')};$('mBack').onclick=()=>{save(true);showMenu('title')}}}

/* ===== SONIDO (sintetizado, sin archivos) ===== */
const AU={ctx:null,mg:null,sg:null,ug:null,nb:null,rainG:null,musT:0,step:0,last:{},
 init(){if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return}
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=this.ctx=new C();
   this.mg=c.createGain();this.mg.connect(c.destination);this.sg=c.createGain();this.sg.connect(this.mg);this.ug=c.createGain();this.ug.connect(this.mg);
   const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this.nb=b;
   this.vol();this.loop(420,.05,.11,.035);this.rainG=this.loop(2600,0,0,0);
   if(c.state==='suspended')c.resume().catch(()=>{})}catch(e){this.ctx=null}},
 vol(){if(!this.ctx)return;this.sg.gain.value=CFG.sfx;this.ug.gain.value=CFG.mus*.6},
 loop(freq,g0,lf,ld){const c=this.ctx,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nb;s.loop=true;f.type='lowpass';f.frequency.value=freq;g.gain.value=g0;
  if(lf){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=lf;lg.gain.value=ld;l.connect(lg);lg.connect(g.gain);l.start()}
  s.connect(f);f.connect(g);g.connect(this.ug);s.start();return g},
 ok(){return this.ctx&&this.ctx.state==='running'},
 tone(f,d,type,v,f2,dl,dest){if(!this.ok())return;const c=this.ctx,t=c.currentTime+(dl||0),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(dest||this.sg);o.start(t);o.stop(t+d+.05)},
 noise(d,v,fr,ft,dl){if(!this.ok())return;const c=this.ctx,t=c.currentTime+(dl||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nb;f.type=ft||'lowpass';f.frequency.value=fr||1000;
  g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f);f.connect(g);g.connect(this.sg);s.start(t,Math.random());s.stop(t+d+.05)},
 music(dt){if(!this.ok()||!G||!running)return;
  if(this.rainG){const w=G.weather.type,tv=w==='storm'?.09:w==='rain'?.055:0;this.rainG.gain.value+=(tv-this.rainG.gain.value)*Math.min(1,dt*2)}
  if(CFG.mus<=0||G.paused)return;this.musT-=dt;if(this.musT>0)return;
  const night=isNight(),boss=!!G.boss,beat=boss?.22:night?.62:.44;this.musT=beat;const st=this.step++,mf=m=>440*Math.pow(2,(m-69)/12);
  const prog=boss?[[45,48,52],[43,47,50],[41,45,48],[40,44,47]]:night?[[45,48,52,55],[41,45,48,52]]:[[48,52,55,57],[45,48,52,55],[41,45,48,53],[43,47,50,55]];
  const ch=prog[(st>>3)%prog.length];
  if(st%8===0){this.tone(mf(ch[0]-12),beat*7,'sine',.1,0,0,this.ug);this.tone(mf(ch[2]-12),beat*7,'sine',.045,0,0,this.ug)}
  if(boss){this.tone(mf(ch[st%3]-12),.16,'sawtooth',.05,0,0,this.ug);if(st%2===0)this.tone(mf(ch[(st>>1)%3]+12),.2,'square',.028,0,0,this.ug)}
  else if(Math.random()<(night?.45:.7)){const n=ch[(Math.random()*ch.length)|0]+(Math.random()<.3?24:12);this.tone(mf(n),night?1.6:.9,'triangle',.07,0,0,this.ug)}}};
function sfx(n){const A=AU;if(!A.ok()||CFG.sfx<=0)return;const now=A.ctx.currentTime;if(A.last[n]&&now-A.last[n]<.05)return;A.last[n]=now;
 switch(n){
 case'swing':A.noise(.09,.1,1800,'highpass');break;
 case'hit':A.noise(.07,.25,900);A.tone(170,.09,'square',.12,80);break;
 case'hurt':A.tone(220,.2,'sawtooth',.18,90);A.noise(.1,.15,600);break;
 case'chop':A.noise(.08,.28,700);A.tone(130,.1,'sine',.25,60);break;
 case'mine':A.noise(.05,.22,3000,'highpass');A.tone(880,.07,'triangle',.12,500);break;
 case'pick':A.tone(660,.08,'sine',.16,990);break;
 case'eat':A.noise(.05,.16,900);A.noise(.05,.14,800,'lowpass',.11);A.noise(.05,.12,700,'lowpass',.22);break;
 case'drink':A.tone(300,.1,'sine',.14,520);A.tone(340,.1,'sine',.12,560,.13);break;
 case'craft':A.tone(523,.1,'triangle',.16);A.tone(784,.16,'triangle',.16,0,.09);break;
 case'place':A.tone(110,.14,'sine',.3,55);A.noise(.08,.18,500);break;
 case'level':[523,659,784,1047].forEach((f,i)=>A.tone(f,.2,'triangle',.17,0,i*.09));break;
 case'coin':A.tone(1319,.07,'square',.07);A.tone(1760,.14,'square',.07,0,.06);break;
 case'quest':[659,784,988].forEach((f,i)=>A.tone(f,.22,'sine',.16,0,i*.1));break;
 case'death':A.tone(300,.9,'sawtooth',.2,50);break;
 case'splash':A.noise(.3,.2,1400,'bandpass');break;
 case'bite':A.tone(880,.07,'square',.12);A.tone(880,.07,'square',.12,0,.12);break;
 case'bow':A.tone(520,.1,'triangle',.14,180);A.noise(.06,.1,2500,'highpass');break;
 case'dash':A.noise(.14,.14,1200,'bandpass');break;
 case'roar':A.tone(85,.8,'sawtooth',.3,45);A.noise(.6,.2,300);break;
 case'slam':A.tone(70,.35,'sine',.4,35);A.noise(.25,.3,400);break;
 case'thunder':A.noise(1.4,.5,180);A.noise(.3,.3,900,'lowpass',.05);break;
 case'sleep':A.tone(392,.5,'sine',.12,262);A.tone(330,.7,'sine',.1,196,.3);break;
 case'horn':A.tone(98,1.6,'sawtooth',.25,92);A.tone(147,1.6,'sawtooth',.14,138);break;
 case'night':A.tone(196,.5,'sine',.1,174);A.tone(165,.8,'sine',.09,147,.4);break;
 case'ui':A.tone(700,.04,'sine',.08);break}}

/* ===== ENTRADA Y BUCLE ===== */
let bHeld=false,lastT=performance.now(),errN=0;
function quickUse(){if(!G||G.paused||!running||G.p.dead)return;const q=G.quick;if(!q){openPanel('inv');toast('Asigna comida al acceso rápido con ☆');return}
 if(q!=='agua'&&!(G.inv[q]>0)){toast(`No te queda ${IT[q]?IT[q].n.toLowerCase():'eso'}.`);return}useItem(q)}
function cancelModes(){if(G&&(G.build||G.demol)){G.build=null;G.demol=false;chipUpd()}}
addEventListener('keydown',e=>{const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'))return;const k=e.key.toLowerCase();
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(keys[k])return;keys[k]=true;AU.init();
 if(!G||!running)return;
 if(k==='escape'){if(modalFn){if(!$('mdF').querySelector('[data-a="mcb"]'))closeModal()}else if(panelTab)closePanel();else cancelModes();return}
 if(G.paused){if(k==='i'&&panelTab==='inv'||k==='c'&&panelTab==='craft'||k==='m'&&panelTab==='map')closePanel();return}
 if(k==='e'||k===' '){aHeld=true;action()}else if(k==='f'){bHeld=true;shoot()}else if(k==='shift')dash();else if(k==='q')quickUse();
 else if(k==='i')openPanel('inv');else if(k==='c')openPanel('craft');else if(k==='m')openPanel('map')});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;if(k==='e'||k===' ')aHeld=false;if(k==='f')bHeld=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;aHeld=false;bHeld=false});
const jb=$('joyBase'),jk=$('joyKnob');
cv.addEventListener('pointerdown',e=>{if(!G||!running||G.paused)return;AU.init();
 if(e.clientX>innerWidth*.6){action();return}
 if(joy.active)return;joy.active=true;joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.dx=joy.dy=0;
 jb.style.display='block';jb.style.left=(e.clientX-50)+'px';jb.style.top=(e.clientY-50)+'px';jk.style.transform='translate(0,0)';$('joyHint').style.display='none';
 try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const l=hyp(dx,dy),R=45;if(l>R){dx=dx/l*R;dy=dy/l*R}joy.dx=dx/R;joy.dy=dy/R;jk.style.transform=`translate(${dx}px,${dy}px)`});
function joyEnd(e){if(e.pointerId!==joy.id)return;joy.active=false;joy.id=null;joy.dx=joy.dy=0;jb.style.display='none'}
cv.addEventListener('pointerup',joyEnd);cv.addEventListener('pointercancel',joyEnd);
const bA=$('bA'),bB=$('bB');
bA.addEventListener('pointerdown',e=>{e.preventDefault();AU.init();aHeld=true;action()});
['pointerup','pointerleave','pointercancel'].forEach(ev=>{bA.addEventListener(ev,()=>aHeld=false);bB.addEventListener(ev,()=>bHeld=false)});
bB.addEventListener('pointerdown',e=>{e.preventDefault();bHeld=true;shoot()});
$('bD').addEventListener('pointerdown',e=>{e.preventDefault();dash()});
$('bQ').addEventListener('click',quickUse);
$('bI').addEventListener('click',()=>{AU.init();openPanel('inv')});
$('bC').addEventListener('click',()=>{AU.init();craftCat='all';openPanel('craft')});
$('mm').addEventListener('click',()=>{mapV.x=mapV.y=0;openPanel('map')});
$('chipX').addEventListener('click',cancelModes);
$('pclose').addEventListener('click',closePanel);
$('panel').addEventListener('click',e=>{if(e.target.id==='panel'){closePanel();return}const t=e.target.closest('[data-a]');if(t&&!t.disabled)uiAct(t.dataset.a,t.dataset.k)});
$('modal').addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&!t.disabled)uiAct(t.dataset.a,t.dataset.k)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){for(const k in keys)keys[k]=false;aHeld=false;bHeld=false;joy.active=false;joy.dx=joy.dy=0;jb.style.display='none';if(G&&running)save(true)}});
function loop(now){const dt=Math.min(.05,Math.max(0,(now-lastT)/1000));lastT=now;
 try{if(G){if(running&&!G.paused&&!G.over){update(dt);if(bHeld&&G&&!G.paused)shoot()}
   if(G){draw(now/1000);G.hudT-=dt;if(G.hudT<=0){G.hudT=.12;hud()}}}
  AU.music(dt);toastTick(dt)}catch(err){if(errN++<20)console.error(err)}
 requestAnimationFrame(loop)}
loadCfg();try{localStorage.removeItem('naufrago_save_v1')}catch(e){}
addEventListener('resize',resize);resize();
if(!matchMedia('(pointer:coarse)').matches)$('joyHint').textContent='WASD: moverte · E: actuar · Mayús: esquivar · I/C/M: paneles';
showMenu('title');cloudInit();requestAnimationFrame(loop);
